<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shafar Admin</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400..900;1,62.5..100,400..900&display=swap">
<style>
/* Layout: espresso sidebar of sections on the left, one working pane on the right; on phones the sidebar slides over from a top bar.
   Brand: the shop's own palette (cream, espresso, bronze, gold), display serif for titles, Jost for everything you operate. */
:root{
  --bg:#F3ECE1;          /* page ground, warm paper */
  --panel:#FFFCF7;       /* cards and tables */
  --panel-2:#F8F1E6;     /* quiet fills, table heads */
  --line:#E7DCCB;        /* hairlines */
  --ink:#2B1810;         /* espresso text */
  --ink-2:#6B4A36;       /* secondary text */
  --ink-3:#9B846E;       /* muted labels */
  --accent:#8A5B1E;      /* bronze: buttons, links, focus */
  --accent-ink:#FFF8EE;
  --accent-soft:#F1E3CC;
  --series:#A8661B;      /* chart marks (validated against the light surface) */
  --series-soft:rgba(168,102,27,.12);
  --grid:#EDE3D4;
  --side:#2C190F;        /* sidebar */
  --side-ink:#E9DCC7;
  --side-mute:#A8927A;
  --gold:#C9A24A;
  --shadow:0 1px 0 rgba(43,24,16,.04),0 12px 32px -18px rgba(43,24,16,.28);
  --st-pending:#B97800; --st-processing:#2A6FC9; --st-shipped:#6A4FC8; --st-completed:#1F8A3B; --st-cancelled:#B8423B;
  --display:"Noto Serif Display","Bodoni 72",Didot,Georgia,serif;
  --ui:"Jost","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17100B; --panel:#211710; --panel-2:#2A1E15; --line:#3A2B20; --ink:#F3E9DA; --ink-2:#CFBBA2; --ink-3:#9D8771;
  --accent:#D3A35A; --accent-ink:#1B120C; --accent-soft:#3A2A1A; --series:#C0812F; --series-soft:rgba(192,129,47,.16); --grid:#2E2219;
  --side:#120B07; --side-ink:#EADCC6; --side-mute:#9A8570; --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.7);
  --st-pending:#E3A12A; --st-processing:#5B9BEB; --st-shipped:#9C88EE; --st-completed:#3DB45E; --st-cancelled:#E06A62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17100B; --panel:#211710; --panel-2:#2A1E15; --line:#3A2B20; --ink:#F3E9DA; --ink-2:#CFBBA2; --ink-3:#9D8771;
  --accent:#D3A35A; --accent-ink:#1B120C; --accent-soft:#3A2A1A; --series:#C0812F; --series-soft:rgba(192,129,47,.16); --grid:#2E2219;
  --side:#120B07; --side-ink:#EADCC6; --side-mute:#9A8570; --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.7);
  --st-pending:#E3A12A; --st-processing:#5B9BEB; --st-shipped:#9C88EE; --st-completed:#3DB45E; --st-cancelled:#E06A62;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;background:var(--side);color:var(--side-ink);
  padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 0;color:inherit;text-decoration:none}
.brand img{width:34px;height:auto}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:23px;line-height:1;letter-spacing:.02em}
.brand span{display:block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--side-mute);text-decoration:none;font-weight:500;transition:background-color .2s,color .2s}
.nav a:hover{color:var(--side-ink);background:rgba(233,220,199,.06)}
.nav a[aria-current="page"]{color:var(--side-ink);background:rgba(201,162,74,.16)}
.nav a[aria-current="page"] svg{color:var(--gold)}
.nav .count{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#2C190F;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.side__foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid rgba(233,220,199,.12);padding-top:14px}
.side__foot a,.side__foot button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--side-mute);text-decoration:none;font-size:13.5px;text-align:left}
.side__foot a:hover,.side__foot button:hover{color:var(--side-ink);background:rgba(233,220,199,.06)}
.mode-pill{display:inline-flex;align-items:center;gap:8px;margin:0 8px;padding:6px 10px;border-radius:8px;border:1px dashed rgba(201,162,74,.6);color:var(--gold);font-size:11.5px;line-height:1.35}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:68px;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) 10px 28px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;letter-spacing:-.005em;text-wrap:balance}
.top__sub{color:var(--ink-3);font-size:13px}
.top__acts{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.top .burger{display:none}
.page{padding:26px max(28px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) 28px;display:grid;gap:22px;align-content:start}

/* ---------- Building blocks ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  font-weight:500;font-size:13.5px;white-space:nowrap;transition:border-color .2s,background-color .2s,transform .15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{border-color:var(--accent);filter:brightness(1.06)}
.btn--danger{color:var(--st-cancelled);border-color:color-mix(in srgb,var(--st-cancelled) 40%,var(--line))}
.btn--ghost{background:none;border-color:transparent}
.btn--sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card__head h2{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2}
.card__head p{color:var(--ink-3);font-size:12.5px}
.card__body{padding:16px 20px 20px}
.grid{display:grid;gap:22px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.link{color:var(--accent);font-weight:500;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.notice svg{color:var(--accent);margin-top:2px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px;display:grid;gap:6px;align-content:start}
.stat__label{font-size:12.5px;color:var(--ink-2)}
.stat__value{font-size:27px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.stat__delta{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.delta--up{color:var(--st-completed)}
.delta--down{color:var(--st-cancelled)}
.stat--todo{cursor:pointer;text-align:left}
.stat--todo:hover{border-color:var(--accent)}

/* status chips: icon + label, colour never alone */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip svg{width:13px;height:13px;stroke-width:2}
.chip--pending{--c:var(--st-pending)} .chip--processing{--c:var(--st-processing)} .chip--shipped{--c:var(--st-shipped)}
.chip--completed{--c:var(--st-completed)} .chip--cancelled{--c:var(--st-cancelled)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tag--gold{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag--warn{background:color-mix(in srgb,var(--st-pending) 14%,transparent);border-color:transparent;color:var(--st-pending)}
.tag--bad{background:color-mix(in srgb,var(--st-cancelled) 12%,transparent);border-color:transparent;color:var(--st-cancelled)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--ui);font-size:11px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink-2);font-weight:600;font-size:11.5px}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .bar{fill:var(--series);transition:opacity .15s}
.chart .bar.dim{opacity:.55}
.chart .hit{fill:transparent;cursor:default}
.chart .line{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--series-soft)}
.chart .dot{fill:var(--series);stroke:var(--panel);stroke-width:2}
.chart .cross{stroke:var(--ink-3);stroke-width:1}
.tip{position:absolute;z-index:5;pointer-events:none;min-width:120px;padding:9px 11px;border-radius:9px;background:var(--ink);color:var(--panel);font-size:12px;line-height:1.35;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap}
.tip b{display:block;font-size:15px;font-weight:600}
.tip span{opacity:.75}
.chart-toggle{font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:12px;align-items:center}
.hbar__name{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px}
.hbar__name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar__pic{width:26px;height:34px;border-radius:13px 13px 4px 4px;display:grid;place-items:end center;flex:none;overflow:hidden}
.hbar__pic img{height:30px;width:auto;max-width:none}
.hbar__track{display:flex;align-items:center;gap:8px;min-width:0}
.hbar__bar{height:14px;border-radius:0 4px 4px 0;background:var(--series);min-width:2px}
.hbar__val{font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* tables */
.tablewrap{overflow-x:auto}
.tablewrap td{white-space:nowrap}
.tablewrap td.who b,.tablewrap td.who span{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--panel-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background-color .15s}
tr.row:hover{background:var(--panel-2)}
td.r,th.r{text-align:right}
.who b{display:block;font-weight:500}
.who span{font-size:12.5px;color:var(--ink-3)}
.ord-no{font-weight:600;color:var(--ink)}
.thumb{width:40px;height:52px;border-radius:20px 20px 6px 6px;display:grid;place-items:end center;overflow:hidden;flex:none}
.thumb img{height:46px;width:auto;max-width:none}
.pcell{display:flex;align-items:center;gap:12px;min-width:200px}
.pcell b{display:block;font-weight:500}
.pcell span{font-size:12.5px;color:var(--ink-3)}
.inline{width:92px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);text-align:right;font-variant-numeric:tabular-nums}
.inline:focus{border-color:var(--accent);outline:none}
.inline.saved{border-color:var(--st-completed)}

/* filter row */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.seg .n{font-size:11.5px;opacity:.7}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.search svg{position:absolute;left:11px;top:10px;color:var(--ink-3)}
select.sel{height:38px;padding:0 30px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}

/* status list on the overview */
.slist{display:grid;gap:4px}
.slist button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px;border-radius:9px;text-align:left}
.slist button:hover{background:var(--panel-2)}
.slist b{font-size:18px;font-weight:600}

/* drawers and dialogs */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,12,7,.42);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.scrim.open{opacity:1;visibility:visible;transition-delay:0s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(560px,100%);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s .32s}
.drawer.wide{width:min(980px,100%)}
.drawer.open{transform:none;visibility:visible;transition-delay:0s}
.drawer__head{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px 22px;border-bottom:1px solid var(--line)}
.drawer__head h2{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.15}
.drawer__head .x{margin-left:auto}
.drawer__body{flex:1;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 24px 22px;display:grid;gap:20px;align-content:start}
.drawer__foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 22px;border-top:1px solid var(--line)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;font-size:13.5px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;overflow-wrap:anywhere}
.lines{display:grid;gap:10px}
.lineitem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}
.totals{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:17px;font-weight:600;padding-top:6px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps button{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-2)}
.steps button[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.modal{position:fixed;left:50%;top:50%;z-index:42;width:min(420px,calc(100% - 32px));transform:translate(-50%,-46%);opacity:0;visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);padding:22px;display:grid;gap:14px;transition:opacity .2s,transform .2s,visibility 0s .2s}
.modal.open{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition-delay:0s}
.modal h2{font-family:var(--display);font-weight:500;font-size:21px}
.modal__acts{display:flex;justify-content:flex-end;gap:10px}

/* forms */
.form{display:grid;gap:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.f{display:grid;gap:6px;min-width:0}
.f label,.f .lab{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%;min-height:40px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.f textarea{resize:vertical;min-height:76px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.f small{font-size:12px;color:var(--ink-3)}
.f .err{color:var(--st-cancelled)}
.checks{display:flex;flex-wrap:wrap;gap:10px 18px}
.check{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.switch{position:relative;display:inline-block;vertical-align:middle;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background-color .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--st-completed)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.colors label{display:grid;gap:6px;font-size:12px;color:var(--ink-3)}
.colors input{width:100%;height:36px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}

/* product editor */
.editor{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px;align-items:start}
.drop{position:relative;display:grid;gap:10px;place-items:center;text-align:center;padding:18px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-3);font-size:13px;transition:border-color .2s,background-color .2s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.preview{position:sticky;top:0;display:grid;gap:12px}
.pcard{display:grid;gap:12px}
.pcard__frame{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:999px 999px 12px 12px;overflow:hidden;background:linear-gradient(180deg,var(--c),var(--e));display:grid;grid-template-rows:minmax(0,1fr);place-items:end center;padding:22% 0 7%}
.pcard__frame img{display:block;height:100%;width:auto;max-width:none;filter:drop-shadow(0 14px 14px rgba(0,0,0,.18))}

.pcard__kind{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--a)}
.pcard__name{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.1;color:var(--k)}
.pcard__desc{font-size:13px;color:var(--ink-2)}
.pcard__price{display:flex;align-items:baseline;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:21px;color:var(--k)}
.pcard__price span{font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.preview__bg{padding:18px;border-radius:12px;background:#F6EFE4;color:#2B1810;--line:#E8DAC3;--ink-2:#6B4A36;--ink-3:#8C735E}

/* sign-in and setup screens */
.gate{min-height:100%;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));

.gate__card{width:min(440px,100%);padding:30px 28px;display:grid;gap:18px}
.gate__card img{width:54px;height:auto;justify-self:center}
.gate__card h1{font-family:var(--display);font-weight:500;font-size:30px;text-align:center;line-height:1.15;text-wrap:balance}
.gate__card p{color:var(--ink-2);text-align:center}
.gate ol{list-style:decimal;padding-left:20px;display:grid;gap:8px;color:var(--ink-2)}

.form-err{color:var(--st-cancelled);font-size:13px;text-align:center;min-height:1.2em}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,16px);opacity:0;visibility:hidden;

.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
.loading{opacity:.55;transition:opacity .2s}
